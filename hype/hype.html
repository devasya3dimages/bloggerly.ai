window.ready = Promise.all([...POSTERS.map(p => load(p, `p/${p}.jpg`)), ...UI.map(u => load(u, `ui/${u}.jpg`)),
  document.fonts.load('100px Anton'), document.fonts.load('100px Bebas')]);

// ---------- helpers
const cl = (x) => Math.max(0, Math.min(1, x));
const eo = (x) => 1 - Math.pow(1 - cl(x), 3);
const eob = (x) => { x = cl(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // overshoot
const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const punch = (t, k = 7) => Math.exp(-ph(t) * k);

function cover(c, im, x, y, w, h, zoom = 1, ox = 0, oy = 0) {   // draw image covering box
  const s = Math.max(w / im.width, h / im.height) * zoom, iw = im.width * s, ih = im.height * s;
  c.drawImage(im, x + (w - iw) / 2 + ox, y + (h - ih) / 2 + oy, iw, ih);
}
function card(c, im, cx, cy, w, rot, sc, glow) {
  const h = w * im.height / im.width;
  c.save(); c.translate(cx, cy); c.rotate(rot); c.scale(sc, sc);
  if (glow) { c.shadowColor = glow; c.shadowBlur = 60 * U; }
  c.fillStyle = '#fff'; c.fillRect(-w / 2 - 6 * U, -h / 2 - 6 * U, w + 12 * U, h + 12 * U);

}
function txt(c, s, x, y, size, opt = {}) {

    c.save(); c.translate(x, y); c.scale(1 + k * 0.06, 1 + k * 0.06); c.globalAlpha = 0.5 / k;
    c.fillStyle = `hsl(${(opt.hue || 0) + k * 55},100%,60%)`; c.fillText(s, 0, 0); c.restore();

function fit(c, s, maxW, size, font = 'Anton') { c.font = `${size}px ${font}`; const w = c.measureText(s).width; return w > maxW ? size * maxW / w : size; }

function tunnel(c, t, hue, speed = 1, alpha = 1) {             // trippy ring tunnel
  c.save(); c.globalAlpha = alpha; c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const R = Math.hypot(W, H) / 2, n = 22, shift = (t * speed * 1.8) % 1;
  for (let i = n; i >= 0; i--) {
    const r = R * Math.pow((i + shift) / n, 2.2) * 1.4;
    c.beginPath(); c.arc(W / 2, H / 2, Math.max(r, 1), 0, 7);
    c.fillStyle = `hsl(${hue + i * 18 + t * 90},90%,${i % 2 ? 12 : 22}%)`; c.fill();
  }

}
function kaleido(c, im, t, n, zoom, spin) {
  const R = Math.hypot(W, H) / 2 + 10, a = 2 * Math.PI / n;
  for (let i = 0; i < n; i++) {
    c.save(); c.translate(W / 2, H / 2); c.rotate(i * a + spin); if (i % 2) c.scale(1, -1);
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, -a / 2 - 0.01, a / 2 + 0.01); c.closePath(); c.clip();
    const s = zoom * R / im.width * 1.4;
    c.drawImage(im, -im.width * s * 0.15 + Math.sin(t) * 40 * U, -im.height * s / 2 + Math.cos(t * 0.7) * 60 * U, im.width * s, im.height * s);
    c.restore();
  }
}
function scanDots(c, alpha) {                                    // LED / halftone texture
  c.save(); c.globalAlpha = alpha; c.fillStyle = '#000';
  const g = 6 * U; for (let y = 0; y < H; y += g) c.fillRect(0, y, W, g * 0.35);
  c.restore();
}

// ---------- sections (draw into `o`, return fx params)
function sIntro(t) {

    txt(o, 'VS', W / 2, H / 2, 260 * U * (0.5 + 0.5 * e) * (1 + 0.12 * punch(t)), { echo: 4, hue: t * 200, stroke: 14 * U, color: '#ffe600' }); }

function sLineup(t) {

  const cw = (P ? 430 : 300) * U;
  L.forEach(([k, n, name], i) => {

}
const KWORDS = ['IDEA', 'BRIEF', 'RESEARCH', 'DRAFT', 'IMAGES', 'CITE IT', 'PUBLISH', 'REPEAT'];
const KPOST = ['05-stranger-alphabet', '12-breaking-tabs-yo', '13-titan-backlog', '01-friends-pivot', '18-fantasy-paper-dragon', '07-stranger-eleven', '15-titan-mikasa-publish', '11-playful-launch-date'];
function sKaleido(t) {
  const lt = t - S(4), b = Math.min(7, Math.floor(lt / BT)), p = punch(t, 6);
  o.fillStyle = '#000'; o.fillRect(0, 0, W, H);
  o.save(); o.filter = `hue-rotate(${t * 160}deg) saturate(1.8)`;
  kaleido(o, img[KPOST[b]], t, 8 + 2 * (b % 3), 1.3 + 0.35 * p, t * 0.9 + b * 0.4); o.restore();
  o.fillStyle = `rgba(0,0,0,${0.25 + 0.2 * (1 - p)})`; o.fillRect(0, 0, W, H);
  const w = KWORDS[b];
  txt(o, w, W / 2, H / 2, fit(o, w, W * 0.92, 300 * U) * (1 + 0.18 * p), { echo: 4, hue: t * 300, stroke: 16 * U });

}
function sProduct(t) {
  const lt = t - S(6), b = Math.floor(lt / BT), second = b >= 4;
  tunnel(o, t, second ? 160 : 200, 1.2, 1); o.fillStyle = 'rgba(0,0,0,.35)'; o.fillRect(0, 0, W, H);
  const im = img[second ? 'calendar' : 'studio'], e = eob(((second ? lt - 4 * BT : lt)) / 0.4);
  const w = W * (P ? 0.92 : 0.78), h = w * im.height / im.width, z = 1 + 0.06 * punch(t) + 0.02 * (lt % (4 * BT));
  o.save(); o.translate(W / 2, H / 2 + (P ? 60 : 30) * U); o.transform(1, (second ? -1 : 1) * 0.05, (second ? 1 : -1) * 0.12, 1, 0, 0);
  o.scale(z * e, z * e); o.shadowColor = `hsl(${t * 200},100%,60%)`; o.shadowBlur = 80 * U;
  o.fillStyle = '#111'; o.fillRect(-w / 2 - 8 * U, -h / 2 - 8 * U, w + 16 * U, h + 16 * U); o.shadowBlur = 0;
  o.drawImage(im, -w / 2, -h / 2, w, h); o.restore();

  txt(o, head, W / 2, (P ? 330 : 120) * U, fit(o, head, W * 0.9, 150 * U) * (1 + 0.06 * punch(t)), { echo: 3, hue: t * 120, stroke: 12 * U, color: '#ffe600' });
  const sub = second ? 'SCHEDULE YOUR WHOLE SEASON' : 'ONE TOOL. WHOLE PUBLISHING JOB.';
  txt(o, sub, W / 2, H - (P ? 330 : 100) * U, fit(o, sub, W * 0.86, 70 * U, 'Bebas'), { font: 'Bebas', track: 4 * U, stroke: 6 * U });
  return { rgb: 3 + 12 * punch(t), flash: (b === 4 ? 0.8 : 0.15) * punch(t, 8), shake: 6 * punch(t), hue: 0 };
}
function sScore(t) {

  o.save(); o.strokeStyle = '#ffb000'; o.lineWidth = 6 * U; o.shadowColor = '#ff8a00'; o.shadowBlur = 30 * U;
  o.strokeRect(px, py, pw, ph2); o.restore();

  const roll = (to, at) => Math.round(to * eo((lt - at) / 0.5));
  txt(o, String(roll(99, 0.1)).padStart(2, '0'), px + pw * 0.27, py + (P ? 300 : 260) * U, 260 * U, amber);
  txt(o, '00', px + pw * 0.73, py + (P ? 300 : 260) * U, 260 * U, { ...amber, color: '#5a4218', glow: null });
  const stats = [['6', 'CHANNELS FROM ONE POST'], ['3', 'MONTHS SCHEDULED'], ['0', 'OPEN TABS']];
  stats.forEach(([n, l], i) => {
    if (b < 2 + i * 2) return;
    const y = py + (P ? 620 + i * 210 : 470 + i * 125) * U, e = eob((lt - (2 + i * 2) * BT) / 0.3);
    o.save(); o.globalAlpha = e;
    txt(o, n, px + 90 * U + (1 - e) * 200 * U, y, (P ? 170 : 120) * U, { ...amber, align: 'left', color: '#fff', glow: '#fff' });
    txt(o, l, px + (P ? 220 : 190) * U + (1 - e) * 200 * U, y, fit(o, l, pw * 0.72, (P ? 80 : 70) * U, 'Bebas'), { ...amber, align: 'left' });
    o.restore();
  });
  txt(o, `Q4  00:${String(Math.max(0, 9 - b)).padStart(2, '0')}`, W / 2, py + ph2 - 50 * U, 60 * U, { ...amber, color: '#ff3b30', glow: '#f00' });
  scanDots(o, 0.35);
  return { rgb: 2 + 6 * punch(t), flash: 0.12 * punch(t, 10), shake: 3 * punch(t), hue: 0 };
}
function sStrobe(t) {
  const lt = t - S(10), k = Math.floor(lt / (BT / 2)), q = ((lt / (BT / 2)) % 1);
  const im = img[POSTERS[(k * 7 + 3) % POSTERS.length]];
  o.fillStyle = '#000'; o.fillRect(0, 0, W, H);
  o.save(); o.filter = `hue-rotate(${(k % 4) * 90 + t * 60}deg) saturate(${1.4 + (k % 2) * 0.6})`;
  cover(o, im, 0, 0, W, H, 1.25 - 0.2 * eo(q * 2)); o.restore();
  // grid of small posters bleeding at the edges
  o.save(); o.globalAlpha = 0.5; o.globalCompositeOperation = 'screen';
  for (let i = 0; i < 6; i++) { const pi = img[POSTERS[(k * 5 + i * 9) % POSTERS.length]]; const cw = 260 * U;
    o.drawImage(pi, (i % 3) * W / 3 + Math.sin(t * 3 + i) * 30 * U, i < 3 ? -60 * U : H - cw * 1.25 + 60 * U, cw, cw * 1.25); }
  o.restore();
  o.fillStyle = 'rgba(0,0,0,.3)'; o.fillRect(0, 0, W, H);
  const line = Math.floor(lt / (2 * BT)) % 2 ? 'EVERY CHANNEL.' : 'EVERY POST.';
  txt(o, line, W / 2, H / 2, fit(o, line, W * 0.92, 220 * U) * (1 + 0.1 * punch(t)), { echo: 3, hue: t * 400, stroke: 14 * U });

}
const CH = ['WORDPRESS', 'LINKEDIN', 'X', 'SANITY', 'SUBSTACK', 'MEDIUM'];
function sAssists(t) {
  const lt = t - S(12), b = Math.floor(lt / BT);
  tunnel(o, t, 330, 1.5, 1); o.fillStyle = 'rgba(0,0,0,.4)'; o.fillRect(0, 0, W, H);
  const im = img['integrations_crop'], w = W * (P ? 0.94 : 0.7), h = w * im.height / im.width;
  o.save(); o.translate(W / 2, H / 2 - (P ? 120 : 40) * U); o.scale(1 + 0.04 * punch(t), 1 + 0.04 * punch(t));
  o.shadowColor = `hsl(${t * 200},100%,60%)`; o.shadowBlur = 90 * U; o.fillStyle = '#fff';
  o.beginPath(); o.roundRect(-w / 2, -h / 2, w, h, 24 * U); o.fill(); o.shadowBlur = 0; o.clip(); o.drawImage(im, -w / 2, -h / 2, w, h); o.restore();

  const idx = Math.min(CH.length - 1, Math.max(0, b - 1));
  if (b >= 1) txt(o, CH[idx], W / 2, H - (P ? 470 : 140) * U, fit(o, CH[idx], W * 0.9, 190 * U) * (1 + 0.15 * punch(t)), { echo: 2, hue: t * 300, stroke: 14 * U });

  for (let i = 0; i < 4; i++) { const c = img[i % 2 ? 'card_completed' : 'card_posted'], fl = ((lt * 0.6 + i * 0.25) % 1);
    o.save(); o.globalAlpha = Math.sin(fl * Math.PI) * 0.9; o.translate(W * (i % 2 ? 0.85 : 0.15), H * (1.1 - fl * 1.2)); o.rotate((i % 2 ? 1 : -1) * 0.15);
    o.drawImage(c, -150 * U, -125 * U, 300 * U, 250 * U); o.restore(); }

}
function sBuild(t) {
  const lt = t - S(14), b = Math.floor(lt / BT);
  o.fillStyle = '#000'; o.fillRect(0, 0, W, H);

function sLogo(t) {
  const lt = t - S(16);
  o.fillStyle = '#000'; o.fillRect(0, 0, W, H);
  // shockwave rings
  for (let i = 0; i < 4; i++) { const r = (lt * 1.6 - i * 0.12) * Math.hypot(W, H) * 0.6; if (r <= 0) continue;

    o.beginPath(); o.arc(W / 2, H / 2, r, 0, 7); o.stroke(); o.restore(); }
  o.save(); o.globalAlpha = 0.25; tunnel(o, t, 350, 0.3, 1); o.restore(); o.fillStyle = 'rgba(0,0,0,.6)'; o.fillRect(0, 0, W, H);
